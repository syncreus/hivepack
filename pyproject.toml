[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivepack"
version = "0.1.0"
description = "Opinionated multi-agent team packs for Buzz (Block)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "HivePack" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mcp = ["mcp>=1.0"]

[project.scripts]
hivepack = "hivepack.cli:main"
buzzctl = "hivepack.buzzctl:main"
receiptmem = "hivepack.receiptmem.listener:main"
stopgate = "hivepack.stopgate.server:main"
receiptmem-mcp = "hivepack.receiptmem.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
